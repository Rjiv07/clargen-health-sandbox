name: FHIR profile validation

on:
  push:
    branches:
      - main
      - "sprint-1/**"
  pull_request:
    branches:
      - main

jobs:
  build-fhir-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install SUSHI
        run: npm install --global fsh-sushi@3.21.0

      - name: Build FHIR profile
        working-directory: backend/identity/fhir
        run: sushi .

      - name: Validate generated StructureDefinition
        run: |
          node -e "const fs=require('fs'); const p='backend/identity/fhir/fsh-generated/resources/StructureDefinition-clargen-patient.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); if(r.resourceType!=='StructureDefinition') throw new Error('Not a StructureDefinition'); if(r.url!=='https://clargen.health/fhir/StructureDefinition/clargen-patient') throw new Error('Unexpected canonical URL: '+r.url); console.log('Validated',r.url);"

      - name: Upload generated FHIR resources
        uses: actions/upload-artifact@v4
        with:
          name: clargen-health-fhir-r4-profile
          path: backend/identity/fhir/fsh-generated/resources/
          if-no-files-found: error
